<div class="page-wrapper">
  <section class="section-head">
    <div>
      <p class="kicker">Product Catalog</p>
      <h2>Curated Looks For Every Mood</h2>
    </div>
    <p class="count">{{ filteredProducts.length }} items</p>
  </section>

  <section class="filter-section">
    <div class="filter-container">
      <button class="category-chip" [class.active]="selectedCategory === null" (click)="filterByCategory(null)">
        All Products
      </button>
      <button *ngFor="let category of categories" class="category-chip"
        [class.active]="selectedCategory === category.categoryId" (click)="filterByCategory(category.categoryId)">
        {{ category.name }}
      </button>
    </div>
  </section>

  <section class="products-grid">
    <article class="product-card" *ngFor="let product of filteredProducts">
      <div class="product-media">
        <img [src]="imageBaseUrl + product.productImg1" alt="{{ product.productName }}" class="product-image" />
      </div>
      <div class="product-content">
        <h3 class="product-name">{{ product.productName }}</h3>
        <p class="product-price">Rs. {{ product.productPrice }}</p>
        <button mat-button class="product-btn" [routerLink]="['/product', product.id]">View Details</button>
      </div>
    </article>
  </section>
</div>
